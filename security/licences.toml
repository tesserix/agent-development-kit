# Licences a consuming product may inherit through the kit. Anything not on this list, and
# anything undeclared, blocks the release. A package offering a choice needs a decision
# below saying which one we took. See docs/security.md.

allowed = [
  "MIT",
  "BSD-3-Clause",
  "BSD-2-Clause",
  "0BSD",
  "Apache-2.0",
  "MPL-2.0",
  "ISC",
  "PSF-2.0",
  "Python-2.0",
  "Zlib",
  "CC0-1.0",
  "Unlicense",
]

# Accepted for one package only, because the obligation is real and does not generalise.
[[acceptance]]
package = "psycopg"
licence = "LGPL-3.0-only"
owner = "@sam123ben"
reason = """
psycopg 3 is LGPL-3.0-only and reaches consumers only through the optional postgres extra.
It is imported unmodified over a published API and never vendored or statically linked, so
the obligation is to keep it replaceable and to say so. A consumer who cannot take LGPL
installs the kit without the postgres extra and loses nothing else.
"""

[[acceptance]]
package = "cffi"
licence = "MIT-0"
owner = "@sam123ben"
reason = """
cffi is an unmodified transitive dependency of cryptography in the optional A2A and MCP
profiles. MIT-0 is permissive, but this acceptance remains package-specific so adding a
different MIT-0 dependency still requires an explicit review.
"""

[[decision]]
package = "cryptography"
licence = "Apache-2.0"
owner = "@sam123ben"
reason = """
cryptography is dual-licensed and arrives transitively through the optional A2A and MCP
profiles. We take Apache-2.0, which matches this project's licence and is already allowed.
"""

[[decision]]
package = "packaging"
licence = "Apache-2.0"
owner = "@sam123ben"
reason = """
packaging is dual-licensed and is used by the optional A2A profile and repository tooling.
We take Apache-2.0, which matches this project's licence and is already allowed.
"""
