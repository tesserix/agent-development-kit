# Every hook is local and runs through `uv run`, so the tool versions are the ones
# in uv.lock — the same ones CI resolves. Parity is asserted by tests/test_gate_parity.py.
default_install_hook_types: [pre-commit]
fail_fast: false

repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: uv run ruff check --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: mypy
        name: mypy --strict
        entry: uv run mypy --strict
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        require_serial: true

      - id: api-surface
        name: public API surface unchanged
        entry: uv run python -m tools.api_surface
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        require_serial: true

      - id: typing-gate
        name: typing escape hatches declared
        entry: uv run python -m tools.typing_gate
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        require_serial: true

      - id: deprecations
        name: deprecations page matches the decorators
        entry: uv run python -m tools.deprecations
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        require_serial: true

      - id: import-linter
        name: RFC 0001 layering contracts
        entry: uv run lint-imports
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        require_serial: true
