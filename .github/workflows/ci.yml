name: CI

on:
  # `labeled` as well, so labelling an open pull request `dependencies` starts the full
  # matrix rather than leaving the fast lane's verdict from before the label.
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
  # Release and Alpha call this workflow rather than copying it: a second set of gates
  # drifts. Alpha runs it on every push to main, so a push trigger here would put the
  # same gates twice in one concurrency group, where they cancel each other.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.1"

jobs:
  lockfile:
    name: lockfile is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      # Fails when pyproject.toml changed without regenerating uv.lock in the same commit.
      - run: uv lock --check

  lint:
    name: ruff rules and formatting
    runs-on: ubuntu-latest
    needs: lockfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --all-groups
      # GitHub format puts each finding on the diff line that caused it.
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .

  documentation:
    name: documentation links and strict build
    runs-on: ubuntu-latest
    needs: lockfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --all-groups
      - run: make docs-check

  typecheck:
    name: mypy --strict
    runs-on: ubuntu-latest
    needs: lockfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --all-groups --all-extras
      - run: uv run mypy --strict src tests tools
      # Annotation coverage of the public surface: an `Any` count nobody measures only grows.
      - run: uv run mypy --strict --any-exprs-report .mypy-any-report src
      - run: cat .mypy-any-report/any-exprs.txt >> "$GITHUB_STEP_SUMMARY"

  typing-conformance:
    name: typing conformance ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: lockfile
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --all-groups --all-extras --python ${{ matrix.python-version }}
      - run: uv run --python ${{ matrix.python-version }} mypy --strict tests/typing_conformance.py
      - run: uv run --python ${{ matrix.python-version }} pyright --pythonversion ${{ matrix.python-version }} tests/typing_conformance.py

  # Fast lane: the ends of the supported range on both developer platforms. Everything
  # a reviewer waits for lives here; the full matrix runs after merge.
  test-fast:
    name: test ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: lockfile
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --all-groups --python ${{ matrix.python-version }}
      - run: uv run pytest --cov --cov-report=term-missing --randomly-seed=${{ github.run_id }}

  test-matrix:
    name: matrix ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: lockfile
    # After merge, and on any pull request that moves a dependency: the fast lane proves
    # the two ends of the supported range, an update has to prove all of it.
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'dependencies')
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --all-groups --python ${{ matrix.python-version }}
      - run: uv run pytest --cov --cov-report=term-missing --randomly-seed=${{ github.run_id }}

  # Proves optional imports are genuinely optional: each extra alone, then the union.
  test-extras:
    name: extras (${{ matrix.extra }})
    runs-on: ubuntu-latest
    needs: lockfile
    strategy:
      fail-fast: false
      matrix:
        extra: [none, a2a, google-adk, mcp, temporal, graphiti, redis, postgres, all]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: sync
        run: |
          case "${{ matrix.extra }}" in
            none) uv sync --frozen --group test --no-install-project
                  uv pip install --no-deps . ;;
            all)  uv sync --frozen --group test --all-extras ;;
            *)    uv sync --frozen --group test --extra "${{ matrix.extra }}" ;;
          esac
      - run: uv run pytest --randomly-seed=${{ github.run_id }}

  # Pre-release and free-threaded interpreters: information for the maintainers,
  # never a gate on a merge.
  test-advisory:
    name: advisory ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: lockfile
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14", "3.14t"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --all-groups --python ${{ matrix.python-version }}
      - run: uv run pytest --randomly-seed=${{ github.run_id }}

  api-surface:
    name: public API surface unchanged
    runs-on: ubuntu-latest
    needs: lockfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --all-groups
      # Prints the added, removed and changed symbols; stays red until the snapshot moves.
      - run: uv run python -m tools.api_surface

  api-reference:
    name: typed API reference is current
    runs-on: ubuntu-latest
    needs: lockfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --all-groups
      - run: uv run python -m tools.api_reference

  recipe-coverage:
    name: every public symbol has a runnable recipe
    runs-on: ubuntu-latest
    needs: lockfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --all-groups
      - run: uv run python -m tools.recipe_coverage

  event-schemas:
    name: event contracts compatible
    runs-on: ubuntu-latest
    needs: lockfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --all-groups
      # Names the event, version and field a subscribed consumer could not absorb.
      - run: uv run python -m tools.event_schemas

  typing-gate:
    name: typing escape hatches declared
    runs-on: ubuntu-latest
    needs: lockfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --all-groups
      # Red on an undeclared ignore or public `Any`, and on a policy entry the code lost.
      - run: uv run python -m tools.typing_gate

  replay-safety:
    name: workflow code replays
    runs-on: ubuntu-latest
    needs: lockfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --all-groups
      # Red on a workflow call that cannot replay, and on a committed history that no longer does.
      - run: uv run python -m tools.replay_check

  versioning-policy:
    name: versioning and deprecation policy
    runs-on: ubuntu-latest
    needs: lockfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        # Tags are the published releases the surface is compared against.
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --all-groups
      - run: uv run python -m tools.deprecations
      - run: make release-check

  release-notes:
    name: release notes assemble
    runs-on: ubuntu-latest
    needs: lockfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        # The notes cover the range since the last tag, which a shallow clone does not have.
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --all-groups
      # Fails on a change with no fragment and no readable subject, and shows reviewers
      # the consumer-facing wording before the tag rather than after it.
      - run: |
          uv run python -m tools.release_notes --version next --dry-run > notes.md
          {
            echo "## Release notes as they would be assembled"
            echo
            cat notes.md
          } >> "$GITHUB_STEP_SUMMARY"

  benchmarks:
    name: performance against the committed baseline
    runs-on: ubuntu-latest
    needs: lockfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --all-groups
      # Exit 1 is a regression and fails the job; exit 2 means the runner was too noisy to
      # say, which is reported and passed rather than blocking a merge on the weather.
      - name: benchmark
        run: |
          set +e
          uv run python -m tools.benchmark > report.txt
          code=$?
          {
            echo "## Benchmarks"
            echo
            echo '```'
            cat report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat report.txt
          [ "$code" = 2 ] && exit 0
          exit "$code"

  layering:
    name: RFC 0001 layering contracts
    runs-on: ubuntu-latest
    needs: lockfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --all-groups
      - run: uv run lint-imports

  dependency-policy:
    name: published requirements
    runs-on: ubuntu-latest
    needs: lockfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --all-groups
      # Fails on an upper bound nobody recorded, and on a record nothing depends on.
      - run: uv run python -m tools.dependency_policy

  admissions:
    name: dependency admissions
    runs-on: ubuntu-latest
    needs: lockfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --all-groups
      # Fails on a package the lock grew since the last review, naming what it reaches.
      - run: uv run python -m tools.admissions

  lowest-direct:
    name: lowest declared versions resolve and pass
    runs-on: ubuntu-latest
    needs: lockfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      # Proves the floors declared in pyproject are real, not aspirational.
      - run: uv sync --resolution lowest-direct --all-groups
      # The sync rewrites the lock, so the committed inventory describes a graph this job
      # deliberately is not installing. The `dependency admissions` job checks that one.
      - run: uv run pytest --deselect tests/test_admissions.py::TestTheRepositoryItself
