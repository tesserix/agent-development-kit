name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.1"

jobs:
  lockfile:
    name: lockfile is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      # Fails when pyproject.toml changed without regenerating uv.lock in the same commit.
      - run: uv lock --check

  test:
    name: test (frozen lock)
    runs-on: ubuntu-latest
    needs: lockfile
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --all-groups
      - run: uv run pytest --cov --cov-report=term-missing --cov-fail-under=90

  lowest-direct:
    name: lowest declared versions resolve and pass
    runs-on: ubuntu-latest
    needs: lockfile
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      # Proves the floors declared in pyproject are real, not aspirational.
      - run: uv sync --resolution lowest-direct --all-groups
      - run: uv run pytest
