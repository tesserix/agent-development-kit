name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  UV_VERSION: "0.12.1"

jobs:
  guard:
    name: tag is releasable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: git fetch origin main --depth=0
      - run: uv sync --frozen --all-groups
      # Everything after this job is irreversible on the index.
      - run: uv run python -m tools.release_guard --tag "$TAG"
        env:
          TAG: ${{ github.ref_name }}

  gates:
    name: full gates
    needs: guard
    uses: ./.github/workflows/ci.yml

  build:
    name: build sdist and wheel
    needs: gates
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        # hatch-vcs reads the version from the tag, so the history has to be there.
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - run: uv build
      - run: uvx twine check --strict dist/*
      # The artefact cannot claim a version the tag did not ask for.
      - run: ls dist | grep -q "tesserix_adk-$VERSION"
        env:
          VERSION: ${{ steps.version.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      # Trusted publishing: the token is minted for this run and expires with it.
      - uses: pypa/gh-action-pypi-publish@release/v1

  mirror:
    name: mirror to the internal index
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      # GitHub Packages has no Python registry, so the release assets are the mirror
      # consumers point --find-links at. See docs/releasing.md.
      - run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}

  divergence:
    name: indexes agree
    needs: [publish, mirror]
    if: always() && needs.publish.result == 'success' && needs.mirror.result != 'success'
    runs-on: ubuntu-latest
    steps:
      # A version on one index and not the other is worse than no release: consumers
      # pinning the mirror get a resolution error for a version that visibly exists.
      - run: |
          echo "::error::${GITHUB_REF_NAME} is on PyPI but not on the mirror."
          echo "Reconcile it with the runbook in docs/releasing.md, then re-run this job."
          exit 1

  smoke:
    name: installs from the index
    needs: [build, publish]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extra: [none, mcp, temporal, graphiti, redis, postgres, all]
    env:
      VERSION: ${{ needs.build.outputs.version }}
      EXTRA: ${{ matrix.extra }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # A clean environment: nothing from this repository is installed, so the run
      # proves the published artefact resolves on its own.
      - run: |
          python -m venv .smoke
          for attempt in 1 2 3 4 5; do
            if [ "$EXTRA" = "none" ]; then
              target="tesserix-adk==$VERSION"
            else
              target="tesserix-adk[$EXTRA]==$VERSION"
            fi
            .smoke/bin/python -m pip install "$target" && break
            echo "index has not caught up yet; retrying in 30s"
            sleep 30
          done
      - run: .smoke/bin/python examples/getting_started.py
