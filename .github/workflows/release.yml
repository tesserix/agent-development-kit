name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  UV_VERSION: "0.12.1"

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  guard:
    name: tag is releasable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      # The checkout above is already unshallow; this only needs main's ref to compare against.
      - run: git fetch origin main
      - run: uv sync --frozen --all-groups
      # Everything after this job is irreversible on the index.
      - run: uv run python -m tools.release_guard --tag "$TAG"
        env:
          TAG: ${{ github.ref_name }}

  gates:
    name: full gates
    needs: guard
    uses: ./.github/workflows/ci.yml

  build:
    name: build sdist and wheel
    needs: gates
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    permissions:
      contents: read
      # Keyless signing by workflow identity: there is no signing key to steal or rotate.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        # hatch-vcs reads the version from the tag, so the history has to be there.
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - run: uv build
      - run: uvx twine check --strict dist/*
      # The artefact cannot claim a version the tag did not ask for.
      - run: ls dist | grep -q "tesserix_adk-$VERSION"
        env:
          VERSION: ${{ steps.version.outputs.version }}
      # Records repository, workflow, commit and build inputs against each artefact's
      # digest, so an install can be traced back to this run. See docs/verifying.md.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/

  sbom:
    name: bill of materials
    needs: gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      # Every extra, because a licence arriving through one is exposure a consumer inherits.
      - run: uv sync --frozen --all-groups --all-extras
      - run: uv run python -m tools.licences
      # Built from the lock at the released tag, so it describes what was published.
      - run: uv run python -m tools.sbom --version "${GITHUB_REF_NAME#v}" --output sbom.cdx.json
      # The previous release's document, when there is one; the first release has none.
      - run: |
          previous=$(gh release list --limit 1 --exclude-pre-releases --json tagName --jq '.[0].tagName // empty')
          if [ -n "$previous" ] && gh release download "$previous" --pattern sbom.cdx.json --dir previous; then
            uv run python -m tools.sbom --diff previous/sbom.cdx.json sbom.cdx.json > sbom-diff.md
          else
            echo "First release with a bill of materials; no previous document to diff." > sbom-diff.md
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      # An unattested component list is one an attacker can edit after the fact.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: sbom.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom
          path: |
            sbom.cdx.json
            sbom-diff.md

  notes:
    name: assemble release notes
    needs: sbom
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --all-groups
      # Blocks on any change that would ship with nothing describing it to a consumer.
      - run: uv run python -m tools.release_notes --version "${GITHUB_REF_NAME#v}" --output notes.md
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: sbom
      # Dependency growth is invisible unless somebody puts it in front of a reader.
      - run: |
          { printf '\n## Dependencies\n\n```\n'; cat sbom-diff.md; printf '```\n'; } >> notes.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: notes
          path: notes.md

  publish:
    name: publish to PyPI
    needs: [build, notes, sbom]
    # Off until the trusted publisher exists on PyPI: a release that fails here would
    # never reach the mirror consumers install from. See docs/releasing.md.
    if: vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/
      # Trusted publishing: the token is minted for this run and expires with it, and
      # the PEP 740 attestation goes to the index with the artefact.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          attestations: true

  mirror:
    name: mirror to the internal index
    needs: [build, notes, sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: notes
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: sbom
      # A mirrored or air-gapped install has no attestation store to reach, so the
      # bundles travel with the artefacts they cover. See docs/verifying.md.
      - run: |
          mkdir -p attestations
          for artefact in dist/* sbom.cdx.json; do
            gh attestation download "$artefact" --repo "$GITHUB_REPOSITORY"
          done
          mv ./*.jsonl attestations/
        env:
          GH_TOKEN: ${{ github.token }}
      # GitHub Packages has no Python registry, so the release assets are the mirror
      # consumers point --find-links at. See docs/releasing.md.
      - run: |
          gh release create "${GITHUB_REF_NAME}" dist/* sbom.cdx.json docs/event-schemas.json \
            attestations/*.jsonl \
            --notes-file notes.md --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}

  docs-publish:
    name: publish versioned documentation
    needs: [build, mirror]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --group docs
      - name: publish the tagged version without replacing earlier versions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if uv run python -c 'import sys; from packaging.version import Version; sys.exit(0 if Version(sys.argv[1]).is_prerelease else 1)' "$VERSION"; then
            uv run mike deploy --push --title "$VERSION (unstable)" "$VERSION"
          else
            uv run mike deploy --push --update-aliases "$VERSION" stable
            uv run mike set-default --push stable
          fi
      - name: materialise the complete version history for GitHub Pages
        run: |
          git fetch origin gh-pages
          mkdir -p published-docs
          git archive --format=tar --output=published-docs.tar origin/gh-pages
          tar -xf published-docs.tar -C published-docs
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: published-docs

  docs-deploy:
    name: deploy versioned documentation
    needs: docs-publish
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  divergence:
    name: indexes agree
    needs: [publish, mirror]
    if: always() && needs.publish.result == 'success' && needs.mirror.result != 'success'
    runs-on: ubuntu-latest
    steps:
      # A version on one index and not the other is worse than no release: consumers
      # pinning the mirror get a resolution error for a version that visibly exists.
      - run: |
          echo "::error::${GITHUB_REF_NAME} is on PyPI but not on the mirror."
          echo "Reconcile it with the runbook in docs/releasing.md, then re-run this job."
          exit 1

  smoke:
    name: installs from the index
    needs: [build, publish]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extra: [none, a2a, google-adk, mcp, temporal, graphiti, redis, postgres, all]
    permissions:
      contents: read
      attestations: read
    env:
      VERSION: ${{ needs.build.outputs.version }}
      EXTRA: ${{ matrix.extra }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      # A clean environment: nothing from this repository is installed, so the run
      # proves the published artefact resolves on its own.
      - run: |
          python -m venv .smoke
          for attempt in 1 2 3 4 5; do
            .smoke/bin/python -m pip download --no-deps --dest downloaded \
              "tesserix-adk==$VERSION" && break
            echo "index has not caught up yet; retrying in 30s"
            sleep 30
          done
      # Fails closed and before the install: verification that runs afterwards protects
      # nothing, and without --signer-workflow any workflow in the repository would do.
      - run: |
          gh attestation verify downloaded/*.whl \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
      - run: |
          if [ "$EXTRA" = "none" ]; then
            target="tesserix-adk==$VERSION"
          else
            target="tesserix-adk[$EXTRA]==$VERSION"
          fi
          .smoke/bin/python -m pip install "$target"
      - run: .smoke/bin/python examples/getting_started.py

  smoke-mirror:
    name: installs from the release assets
    needs: [build, mirror]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extra: [none, a2a, google-adk, mcp, temporal, graphiti, redis, postgres, all]
    permissions:
      contents: read
      attestations: read
    env:
      VERSION: ${{ needs.build.outputs.version }}
      EXTRA: ${{ matrix.extra }}
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      # The mirror is the path consumers actually use while PyPI publishing is off, so it
      # is exercised the way they use it: assets in, nothing from this working tree.
      - run: |
          python -m venv .smoke
          gh release download "$TAG" --pattern '*.whl' --pattern '*.tar.gz' --dir downloaded
      - run: |
          gh attestation verify downloaded/*.whl \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
      - run: |
          if [ "$EXTRA" = "none" ]; then
            target="tesserix-adk==$VERSION"
          else
            target="tesserix-adk[$EXTRA]==$VERSION"
          fi
          .smoke/bin/python -m pip install --find-links downloaded "$target"
      - run: .smoke/bin/python examples/getting_started.py
