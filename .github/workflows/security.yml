name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # An advisory published the day after a merge is not caught by a merge trigger.
    - cron: "17 3 * * *"
  workflow_dispatch:

# No secrets are used anywhere in this workflow, so it runs on a fork's pull request
# rather than skipping — which is where an unreviewed dependency is most likely to arrive.
permissions:
  contents: read

env:
  UV_VERSION: "0.12.1"
  GITLEAKS_VERSION: "8.28.0"

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  advisories:
    name: advisories against the lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      # --frozen: the audit has to be of the set CI installs, not of a fresh resolution.
      - run: uv sync --frozen --all-groups --all-extras
      - run: uv run python -m tools.audit | tee advisories.txt
      - if: always()
        run: |
          { echo "## Advisories"; echo; echo '```'; cat advisories.txt; echo '```'; } \
            >> "$GITHUB_STEP_SUMMARY"

  licences:
    name: licence policy across the graph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      # Every extra: a licence a consumer only inherits through one is still inherited.
      - run: uv sync --frozen --all-groups --all-extras
      - run: uv run python -m tools.licences

  secrets:
    name: credentials in the tree and the history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        # A credential removed in a later commit is still in the history and still live.
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --all-groups
      # The tree, including recorded provider traffic and documentation examples.
      - run: uv run python -m tools.secret_scan
      # The history, which the tree scan cannot see. Pinned and run as a binary: the
      # action wants a licence key for organisations, and a key is a secret this
      # workflow deliberately does not have.
      - run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks git --no-banner --redact --exit-code 1 .

  disclosure:
    name: disclosure commitments
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --all-groups
      # Daily, not only on merge: a target is missed by time passing, not by a commit.
      - run: uv run python -m tools.disclosure
