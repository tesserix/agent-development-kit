name: Alpha

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_VERSION: "0.12.1"

concurrency:
  # Two alphas racing for the same number means one of them is a yank.
  group: alpha
  cancel-in-progress: false

jobs:
  gates:
    name: full gates
    uses: ./.github/workflows/ci.yml

  whether:
    name: is there an alpha to build
    runs-on: ubuntu-latest
    outputs:
      alpha: ${{ steps.check.outputs.alpha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # The release commit is pushed with its tag, so it already has a version of its
      # own; an alpha built from it would number below the release it was cut from.
      - id: check
        run: |
          if git describe --exact-match --tags HEAD >/dev/null 2>&1; then
            echo "alpha=false" >> "$GITHUB_OUTPUT"
          else
            echo "alpha=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: build the alpha
    needs: [gates, whether]
    if: needs.whether.outputs.alpha == 'true'
    runs-on: ubuntu-latest
    outputs:
      alpha: ${{ steps.recheck.outputs.alpha }}
      version: ${{ steps.version.outputs.version }}
    permissions:
      contents: read
      # Keyless signing by workflow identity: an unattested channel is the one an
      # attacker publishes through, so the alpha is signed exactly like a release.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        # hatch-vcs derives the version from the tag, so the history has to be there.
        with:
          fetch-depth: 0
      # A release tag can appear while the full gates are running. Recheck on this
      # job's checkout so that race ends as a successful no-op, not a false alpha.
      - id: recheck
        run: |
          if git describe --exact-match --tags HEAD >/dev/null 2>&1; then
            echo "alpha=false" >> "$GITHUB_OUTPUT"
          else
            echo "alpha=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.recheck.outputs.alpha == 'true'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - if: steps.recheck.outputs.alpha == 'true'
        run: uv sync --frozen --all-groups
      - if: steps.recheck.outputs.alpha == 'true'
        id: version
        run: echo "version=$(uv run python -m tools.alpha)" >> "$GITHUB_OUTPUT"
      # Tagged locally and never pushed: the tag is how hatch-vcs sees the version, but
      # an alpha is not a release and should not appear in the repository's tag list.
      - if: steps.recheck.outputs.alpha == 'true'
        run: git tag "v$VERSION"
        env:
          VERSION: ${{ steps.version.outputs.version }}
      - if: steps.recheck.outputs.alpha == 'true'
        run: uv build
      - if: steps.recheck.outputs.alpha == 'true'
        run: uvx twine check --strict dist/*
      - if: steps.recheck.outputs.alpha == 'true'
        run: ls dist | grep -q "tesserix_adk-$VERSION"
        env:
          VERSION: ${{ steps.version.outputs.version }}
      - if: steps.recheck.outputs.alpha == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/*
      - if: steps.recheck.outputs.alpha == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: alpha-dist
          path: dist/

  publish:
    name: publish the alpha
    needs: build
    # Waits for the one-time trusted-publisher setup in docs/releasing.md. The build above
    # still runs on every merge, so the alpha is proven publishable either way.
    if: needs.build.outputs.alpha == 'true' && vars.PUBLISH_ALPHAS == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: alpha-dist
          path: dist/
      # Trusted publishing: the token is minted for this run and expires with it, and
      # the PEP 740 attestation goes to the index with the artefact.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          attestations: true

  downstream:
    name: earliest consumer
    needs: [build, publish]
    if: needs.build.outputs.alpha == 'true' && vars.DOWNSTREAM_REPO != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read
    env:
      VERSION: ${{ needs.build.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      KIT: ${{ github.repository }}
    steps:
      # The consumer pipeline refuses an unattested artefact rather than warning about
      # it: a warning in someone else's pipeline is not protection.
      - run: |
          python -m pip download --no-deps --dest downloaded "tesserix-adk==$VERSION"
          gh attestation verify downloaded/*.whl --repo "$KIT" \
            --signer-workflow "$KIT/.github/workflows/alpha.yml"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ vars.DOWNSTREAM_REPO }}
          token: ${{ secrets.DOWNSTREAM_TOKEN }}
          path: consumer
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      # Two runs of the same suite. The consumer's own failures show up in both, so the
      # comparison is what decides; neither run may fail the job on its own.
      - run: uv run --directory consumer --with "tesserix-adk" pytest --junitxml=../baseline.xml
        continue-on-error: true
      - run: |
          uv run --directory consumer --with "tesserix-adk==$VERSION" \
            pytest --junitxml=../candidate.xml
        continue-on-error: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: kit
      - run: |
          uv run --directory kit python -m tools.downstream \
            --baseline baseline.xml --candidate candidate.xml --report regressions.md
      - if: failure()
        run: cat regressions.md >> "$GITHUB_STEP_SUMMARY"

  retention:
    name: alpha retention
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --all-groups
      # A report, not an action: PyPI has no yank API a trusted publisher can call, so
      # the yanks are done by hand from this list. See docs/releasing.md.
      - run: uv run python -m tools.alpha --retention >> "$GITHUB_STEP_SUMMARY"
