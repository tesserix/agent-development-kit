[project]
name = "tesserix-adk"
version = "0.0.1"
description = "Agent development kit: typed primitives, a substitutable runtime, and CPU-first inference."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Tesserix" }]
keywords = ["agents", "llm", "runtime", "orchestration"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = ["pydantic>=2.9,<3"]

[project.urls]
Homepage = "https://github.com/tesserix/agent-development-kit"
Issues = "https://github.com/tesserix/agent-development-kit/issues"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tesserix_adk"]

[tool.uv]
required-version = ">=0.12,<0.13"
default-groups = ["dev", "test"]

[dependency-groups]
dev = [
  "ruff>=0.14,<0.15",
  "mypy>=1.18,<2",
  "import-linter>=2.3,<3",
]
test = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<0.25",
  "pytest-cov>=6,<7",
  "hypothesis>=6.112,<7",
]
docs = ["mkdocs-material>=9.5,<10"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",      # pycodestyle
  "F",           # pyflakes
  "I",           # isort
  "N",           # pep8-naming
  "UP",          # pyupgrade
  "B",           # bugbear
  "A",           # builtins shadowing
  "C4",          # comprehensions
  "SIM",         # simplify
  "TC",          # type-checking blocks
  "PT",          # pytest style
  "RUF",         # ruff-specific
  "ASYNC",       # async correctness
  "S",           # bandit
  "ANN",         # missing annotations
  "D",           # docstrings
]
ignore = [
  "D107",  # __init__ docstring — the class docstring covers it
  "D203",  # incompatible with D211
  "D213",  # incompatible with D212
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "D", "ANN"]
# Payload types are owned by the stories that introduce them (models, tools, memory);
# until then a protocol placeholder is honestly Any rather than falsely narrow. RFC 0001.
"src/tesserix_adk/core/protocols.py" = ["ANN401"]
"src/tesserix_adk/testing/fakes.py" = ["ANN401"]
# Conformance suites are test code that ships in src: asserts are the point, and each
# case name states the behaviour it checks.
"src/tesserix_adk/testing/conformance.py" = ["S101", "D102", "ANN401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
enable_error_code = ["redundant-expr", "truthy-bool", "ignore-without-code"]
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers --strict-config"
xfail_strict = true

[tool.coverage.run]
source = ["src/tesserix_adk"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "^\\s*\\.\\.\\.$",       # Protocol method stubs are declarations, not code
  "@(abc\\.)?abstractmethod",
]
