[project]
name = "tesserix-adk"
dynamic = ["version"]
description = "Agent development kit: typed primitives, a substitutable runtime, and CPU-first inference."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Tesserix" }]
keywords = ["agents", "llm", "runtime", "orchestration"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
# Floors only. A speculative upper bound turns an upgrade the consuming product chose
# into a resolution error it cannot fix without forking the kit; every cap is an
# exception recorded in security/dependencies.toml. See docs/dependencies.md.
dependencies = [
  "pydantic>=2.9",
  "httpx>=0.27",
  "opentelemetry-api>=1.27",
]

# Provider and store SDKs may only ever appear here, never in [project] dependencies:
# a small agent must stay a small dependency. `all` is a pure union of the others so it
# cannot become the only tested path. See docs/contributing.md.
[project.optional-dependencies]
mcp = ["mcp>=1.9"]
temporal = ["temporalio>=1.9"]
# The one recorded cap: below 1.0 the version number promises nothing.
graphiti = ["graphiti-core>=0.14,<1"]
redis = ["redis>=5.2"]
postgres = ["psycopg[binary,pool]>=3.2"]
all = ["tesserix-adk[graphiti,mcp,postgres,redis,temporal]"]

[project.urls]
Homepage = "https://github.com/tesserix/agent-development-kit"
Issues = "https://github.com/tesserix/agent-development-kit/issues"

[build-system]
requires = ["hatchling>=1.31.0", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

# The tag is the version. Deriving it anywhere else lets the artefact disagree with the
# release it claims to be; see docs/releasing.md.
[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/tesserix_adk"]

[tool.uv]
required-version = ">=0.12,<0.13"
default-groups = ["dev", "test"]

[dependency-groups]
dev = [
  "ruff>=0.14,<0.15",
  "mypy>=1.18,<2",
  "import-linter>=2.3,<3",
  "pre-commit>=4,<5",
  # tools/downstream.py parses a JUnit report written by another repository's CI.
  "defusedxml>=0.7,<0.8",
  "types-defusedxml>=0.7,<0.8",
  "pip-audit>=2.7,<3",
]
test = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<0.25",
  "pytest-cov>=6,<7",
  "hypothesis>=6.112,<7",
  "pyyaml>=6.0.2,<7",
  "types-pyyaml>=6,<7",
  "pytest-randomly>=3.15,<4",
  "packaging>=24,<27",
  # Test-only: proves an emitted schema accepts exactly what its Python type accepts.
  "jsonschema>=4.23,<5",
  "types-jsonschema>=4.23,<5",
]
docs = ["mkdocs-material>=9.5,<10"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",      # pycodestyle
  "F",           # pyflakes
  "I",           # isort
  "N",           # pep8-naming
  "UP",          # pyupgrade
  "B",           # bugbear
  "A",           # builtins shadowing
  "C4",          # comprehensions
  "SIM",         # simplify
  "TC",          # type-checking blocks
  "PT",          # pytest style
  "RUF",         # ruff-specific
  "ASYNC",       # async correctness
  "S",           # bandit
  "ANN",         # missing annotations
  "D",           # docstrings
  "T20",         # no stray print
  "PGH",         # no bare type: ignore or noqa
  "ARG",         # unused arguments
  "RET",         # return simplification
]
ignore = [
  "D107",  # __init__ docstring — the class docstring covers it
  "D203",  # incompatible with D211
  "D213",  # incompatible with D212
]

# Relaxation allowlist. Every entry needs the owner and the reason on the line above,
# enforced by tests/test_lint_policy.py. This list is meant to shrink; adding to it is
# a reviewed change, not a way to get a red build green.
[tool.ruff.lint.per-file-ignores]
# owner: @sam123ben — reason: asserts are the mechanism of a test suite, and test
# bodies document themselves through their names.
"tests/*" = ["S101", "D", "ANN"]
# owner: @sam123ben — reason: a seeded Random is how the backoff schedule is asserted
# rather than waited out; jitter is not a security boundary.
"tests/test_retry.py" = ["S101", "D", "ANN", "S311"]
# owner: @sam123ben — reason: the example seeds the jitter source so its printed backoff
# schedule is reproducible; jitter is not a security boundary.
"examples/retry.py" = ["S311"]
# owner: @sam123ben — reason: payload types are owned by the stories that introduce
# them (models, tools, memory); until then a protocol placeholder is honestly Any
# rather than falsely narrow. Removed when those stories land. RFC 0001.
"src/tesserix_adk/core/protocols.py" = ["ANN401"]
# owner: @sam123ben — reason: mirrors the protocol placeholders above.
"src/tesserix_adk/testing/fakes.py" = ["ANN401"]
# owner: @sam123ben — reason: a cassette raises whatever the recorded provider raised and
# wraps a provider whose request type the provider protocol still owns (#49); asserts are
# the mechanism of assert_same_run.
"src/tesserix_adk/testing/cassette.py" = ["S101", "ANN401"]
# owner: @sam123ben — reason: a canonical digest is taken over arbitrary JSON, which is
# honestly Any rather than falsely narrow.
"src/tesserix_adk/runtime/determinism.py" = ["ANN401"]
# owner: @sam123ben — reason: conformance suites are test code that ships in src, so
# asserts are the mechanism, and each case name states the behaviour it checks.
"src/tesserix_adk/testing/conformance.py" = ["S101", "D102", "ANN401"]

[tool.ruff.lint.isort]
known-first-party = ["tesserix_adk", "tests"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
enable_error_code = ["redundant-expr", "truthy-bool", "ignore-without-code"]
files = ["src", "tests", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers --strict-config"
xfail_strict = true
# A warning the kit emits and nobody sees is a breakage already scheduled for a consumer.
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/tesserix_adk", "tools"]
branch = true

[tool.coverage.report]
# The floor lives here alone; a workflow that repeats it can lower it without review.
fail_under = 90
show_missing = true
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "^\\s*\\.\\.\\.$",       # Protocol method stubs are declarations, not code
  "@(abc\\.)?abstractmethod",
  "if __name__ == .__main__.:",
]
