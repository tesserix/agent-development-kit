# Every escape from the kit's typing guarantee, declared. `make typing-gate` fails on an
# escape that is not here and on an entry the code no longer contains, so the inventory
# cannot rot in either direction. Adding an entry is a review decision, not a build fix.
#
# The policy this file implements is docs/typing.md.

# Who may own an entry. An entry owned by anyone else fails the gate rather than being
# inherited by whoever touches the file next.
owners = ["@sam123ben"]

# The checker this policy speaks for. A new mypy tightens rules and reclassifies ignores,
# so the version moves on a deliberate upgrade that re-runs the gate — never on a float.
checker = "mypy>=1.18,<2"

# ---------------------------------------------------------------------------------------
# `# type: ignore[code]` in src/. Each is a place the checker is wrong or cannot see, not
# a place the code is.
# ---------------------------------------------------------------------------------------

[[ignore]]
path = "src/tesserix_adk/core/deprecation.py"
code = "misc"
reason = """
Reading and reassigning `__init__` on a class the decorator was handed. Assigning to a
method is exactly what a deprecation shim does, and mypy has no way to express "this
assignment is the point". Confined to the decorator; nothing it returns is untyped.
"""
owner = "@sam123ben"
review_by = 2027-08-07

[[ignore]]
path = "src/tesserix_adk/testing/pytest_plugin.py"
code = "method-assign"
reason = """
The network guard replaces `socket.socket.connect` for the duration of a test session and
restores it afterwards. Patching a stdlib method is the mechanism, so the error is the
checker correctly describing a thing that is deliberate.
"""
owner = "@sam123ben"
review_by = 2027-08-07

[[ignore]]
path = "src/tesserix_adk/testing/pytest_plugin.py"
code = "assignment"
reason = """
Same assignment as above: the guard's signature is broader than `socket.connect`'s so it
can refuse every call shape, which mypy reads as an incompatible assignment.
"""
owner = "@sam123ben"
review_by = 2027-08-07

# ---------------------------------------------------------------------------------------
# `Any` in an exported signature. Three kinds are allowed, and nothing else: `json` for a
# document that is heterogeneous by definition, `variadic` for a sink that forwards what it
# is handed, and `provisional` for a placeholder a named story replaces.
# ---------------------------------------------------------------------------------------

